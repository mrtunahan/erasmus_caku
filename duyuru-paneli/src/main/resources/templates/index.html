<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Duyuru Takip Paneli</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Çankırı Karatekin Üniversitesi - Duyuru Takip Paneli</h4>
                <small>BMU Bölüm + Üniversite Ana Sayfa Duyuruları</small>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(duyurular)}" class="alert alert-warning">
                    Henüz duyuru çekilemedi. Lütfen birkaç saniye bekleyip sayfayı yenileyin.
                </div>
                <table th:if="${!#lists.isEmpty(duyurular)}" class="table table-hover">
                    <thead>
                        <tr>
                            <th>Kaynak</th>
                            <th>Tarih</th>
                            <th>Başlık</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d : ${duyurular}">
                            <td>
                                <span th:if="${d.kaynak == 'BMU'}" class="badge bg-success">BMU</span>
                                <span th:if="${d.kaynak == 'Üniversite'}" class="badge bg-info">Üniversite</span>
                            </td>
                            <td th:text="${d.tarih}"></td>
                            <td th:text="${d.baslik}"></td>
                            <td>
                                <a th:href="${d.link}" target="_blank"
                                   class="btn btn-sm btn-outline-primary"
                                   th:if="${d.link != null and !d.link.isEmpty()}">İncele</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer text-muted text-center">
                Her 30 dakikada otomatik güncellenir | Port: 8085
            </div>
        </div>
    </div>
</body>
</html>
