# ══════════════════════════════════════════════════════════════
# TANITIM SAYFASI + UYGULAMA AYRIMI
#
# Kök adres (/) artık tanıtım sayfasıdır; uygulama /panel altındadır.
# Ziyaretçi sırf sistemin ne olduğunu görmek için 570 kB'lik uygulama
# paketini indirmesin diye tanıtım saf HTML'dir (~18 kB) ve React yüklemez.
#
# ── NASIL UYGULANIR ──
# Bu dosya kopyalanacak bir yapılandırma DEĞİL, mevcut HTTPS server bloğuna
# eklenecek İKİ bloktur. Hedef dosya:
#   /etc/nginx/sites-enabled/caku-erasmus        ← CANLI OLAN BU
#
# DİKKAT: sites-enabled/caku-erasmus bir SYMLINK DEĞİL, ayrı bir kopyadır.
# sites-available altındakini düzenlemek hiçbir şey yapmaz. Ayrıntı ve
# diğer tuzaklar: dagitim/DAGITIM.md
#
# Aşağıdaki iki bloğu, oradaki `location / { ... }` bloğunun HEMEN ÜSTÜNE
# ekleyin. Mevcut `location /` bloğuna DOKUNMAYIN: statik dosyaları o
# servis ediyor ve bilinmeyen yolları uygulamaya düşürüyor.
#
# `root /var/www/erasmus_caku/dist;` sunucu bloğunda zaten tanımlı olduğu
# için burada tekrar yazılmaz.
#
# ── ÖNCELİK SIRASI ──
# nginx tam eşleşmeyi (`= /`) prefix'ten önce dener; uzun prefix (`/panel`)
# kısa olanı (`/`) yener. Yani bu iki blok mevcut `location /` kuralını
# yalnızca kendi yollarında geçersiz kılar, geri kalan her şey aynı kalır.
#
# ── HASH ROTALARI NGINX'TEN YÖNLENDİRİLEMEZ ──
# Uygulama `#erasmus` gibi hash rotalar kullanır ve hash SUNUCUYA HİÇ
# GİTMEZ. Eski `/#erasmus` yer imleri tanıtım sayfasındaki küçük betikle
# /panel/#erasmus adresine taşınır (bkz. public/tanitim.html).
# ══════════════════════════════════════════════════════════════

    # ── Kök: tanıtım sayfası ──
    location = / {
        limit_req zone=general burst=100 nodelay;
        try_files /tanitim.html =404;
        # Tanıtım metni değişince ziyaretçi eskisini görmesin (5 dk).
        add_header Cache-Control "public, max-age=300" always;
    }

    # ── Uygulama: /panel ve altındaki her yol ──
    # Uygulamanın varlıkları /assets/... ve /logo.png gibi MUTLAK yollarla
    # yüklenir; bu yüzden /panel altında da sorunsuz çalışır.
    location /panel {
        limit_req zone=general burst=100 nodelay;
        try_files /index.html =404;
        # SPA kabuğu asla önbelleğe alınmamalı: yeni dağıtımda varlık
        # adları değişir, önbellekten gelen eski index yeni assets'i
        # bulamaz ve kullanıcı boş sayfa görür.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

# ── UYGULADIKTAN SONRA ──
#   nginx -t && systemctl restart nginx      # reload YETMEYEBİLİR
#   sleep 3; curl -s https://offlineasistan.com.tr/ | wc -c   # ~18265
