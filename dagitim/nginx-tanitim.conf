# ══════════════════════════════════════════════════════════════
# TANITIM SAYFASI + UYGULAMA AYRIMI
#
# Kök adres (/) artık tanıtım sayfasıdır; uygulama /panel altındadır.
# Ziyaretçi sırf sistemin ne olduğunu görmek için 570 kB'lik uygulama
# paketini indirmesin diye tanıtım saf HTML'dir (~18 kB) ve React yüklemez.
#
# Bu dosya SUNUCUDAKİ mevcut server bloğuna eklenecek parçalardır; olduğu
# gibi kopyalanacak bir tam yapılandırma değildir. Mevcut bloktaki
# `location /` kuralının YERİNE aşağıdakiler gelir.
#
# ── HASH ROTALARI ──
# Uygulama `#erasmus` gibi hash rotalar kullanır ve hash SUNUCUYA HİÇ
# GİTMEZ — nginx onu göremez, buradan yönlendiremezsiniz. Eski `/#erasmus`
# yer imleri tanıtım sayfasındaki küçük betikle /panel/#erasmus adresine
# taşınır (bkz. public/tanitim.html).
# ══════════════════════════════════════════════════════════════

# Kök: tanıtım sayfası
location = / {
    root /var/www/erasmus_caku/dist;
    try_files /tanitim.html =404;
    # Tanıtım metni değişince ziyaretçi eskisini görmesin.
    add_header Cache-Control "public, max-age=300";
}

# Uygulama: /panel ve altındaki her yol tek sayfa uygulamasına düşer.
# Uygulamanın varlıkları /assets/... ve /logo.png gibi MUTLAK yollarla
# yüklenir; bu yüzden /panel altında da sorunsuz çalışır.
location /panel {
    root /var/www/erasmus_caku/dist;
    try_files /index.html =404;
    # index.html önbelleğe alınmamalı: yeni dağıtımda varlık adları değişir,
    # eski index yeni assets'i bulamaz.
    add_header Cache-Control "no-cache, must-revalidate";
}

# Varlıklar (hash'li dosya adları — uzun süre önbelleklenebilir)
location /assets/ {
    root /var/www/erasmus_caku/dist;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# ── ESKİ BAĞLANTILARI KIRMA ──
# Bazı kullanıcılar /index.html adresini yer imine almış olabilir; onları
# uygulamaya gönder (tanıtıma değil — o adres hep uygulamaydı).
location = /index.html {
    return 301 /panel/;
}
