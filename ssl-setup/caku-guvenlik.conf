# ══════════════════════════════════════════════════════════════
# GÜVENLİK BAŞLIKLARI — /etc/nginx/snippets/caku-guvenlik.conf
#
# ⚠ NEDEN AYRI DOSYA: nginx'te bir location bloğu KENDİ add_header satırını
# taşıyorsa server düzeyindeki add_header'ların HİÇBİRİNİ devralmaz. Bu
# yüzden /, /panel ve statik dosyalar (Cache-Control ekleyen bloklar) HSTS
# ve çerçeve korumasını kaybediyordu. Bu dosya server düzeyinde VE
# add_header kullanan her location içinde include edilir.
#
# Kurulum:
#   sudo cp ssl-setup/caku-guvenlik.conf /etc/nginx/snippets/caku-guvenlik.conf
#   (site dosyasında ilgili yerlere: include snippets/caku-guvenlik.conf;)
#   sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Panelin başka bir siteye gömülmesini (tıklama tuzağı) engeller. Yalnız
# frame-ancestors: sayfanın asıl CSP'si index.html meta etiketindedir; iki
# politika birlikte uygulanır, bu satır başka hiçbir şeyi kısıtlamaz.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
