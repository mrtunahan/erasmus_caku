# ============================================================
# ÇAKÜ Erasmus - Nginx SSL Konfigürasyonu (IP Adresi İçin)
# ============================================================
#
# Kurulum:
#   1. Bu dosyayı kopyalayın:
#      sudo cp nginx-ssl.conf /etc/nginx/sites-available/caku-erasmus
#
#   2. Sembolik link oluşturun:
#      sudo ln -s /etc/nginx/sites-available/caku-erasmus /etc/nginx/sites-enabled/
#
#   3. Default konfigürasyonu devre dışı bırakın (isteğe bağlı):
#      sudo rm /etc/nginx/sites-enabled/default
#
#   4. Nginx'i test edin ve yeniden başlatın:
#      sudo nginx -t
#      sudo systemctl restart nginx
#
# NOT: <SUNUCU_IP> yazan yerleri kendi IP adresinizle değiştirin!
# ============================================================

# HTTP -> HTTPS yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Tüm HTTP trafiğini HTTPS'e yönlendir
    return 301 https://$host$request_uri;
}

# HTTPS sunucu bloğu
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ── SSL Sertifika Yolları ──
    ssl_certificate     /etc/ssl/caku-erasmus/server.crt;
    ssl_certificate_key /etc/ssl/caku-erasmus/server.key;

    # ── SSL Güvenlik Ayarları ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Güvenlik Header'ları ──
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # ── Proje Kök Dizini ──
    # Bu yolu projenizin bulunduğu dizinle değiştirin
    root /var/www/caku-erasmus;
    index index.html;

    # ── Ana Konum Bloğu ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Statik Dosyalar (JSX, CSS, JS, Resimler) ──
    location ~* \.(jsx|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Gzip Sıkıştırma ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml text/jsx;
    gzip_min_length 256;
    gzip_vary on;

    # ── Güvenlik: Gizli Dosyaları Engelle ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Log Dosyaları ──
    access_log /var/log/nginx/caku-erasmus-access.log;
    error_log  /var/log/nginx/caku-erasmus-error.log;
}
