# ============================================================
# ÇAKÜ Erasmus - Nginx SSL Konfigürasyonu (IP Adresi İçin)
# ============================================================
# Güvenlik Özellikleri:
#   - Rate Limiting (DDoS/brute-force koruması)
#   - WAF (Web Application Firewall) kuralları
#   - .git, veritabanı dosyaları gizleme
#   - Server bilgileri gizleme (UID, versiyon)
#   - Güvenlik header'ları
#
# Kurulum:
#   1. sudo cp nginx-ssl.conf /etc/nginx/sites-available/caku-erasmus
#   2. sudo ln -sf /etc/nginx/sites-available/caku-erasmus /etc/nginx/sites-enabled/
#   3. sudo rm -f /etc/nginx/sites-enabled/default
#   4. sudo nginx -t && sudo systemctl restart nginx
#
# NOT: <SUNUCU_IP> yazan yerleri kendi IP adresinizle değiştirin!
# ============================================================

# ── Rate Limiting Tanımları ──
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_req_status 429;
limit_conn_status 429;

# HTTP -> HTTPS yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    return 301 https://$host$request_uri;
}

# HTTPS sunucu bloğu
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ══════════════════════════════════════════════
    # UID / SERVER BİLGİLERİ GİZLEME
    # ══════════════════════════════════════════════
    server_tokens off;
    # more_clear_headers 'Server';
    # more_clear_headers 'X-Powered-By';
    # more_clear_headers 'X-AspNet-Version';
    # more_clear_headers 'X-Runtime';
    # more_clear_headers 'X-Version';
    # more_clear_headers 'X-Request-Id';

    # ── SSL Sertifika Yolları ──
    ssl_certificate     /etc/ssl/caku-erasmus/server.crt;
    ssl_certificate_key /etc/ssl/caku-erasmus/server.key;

    # ── SSL Güvenlik Ayarları ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ══════════════════════════════════════════════
    # GÜVENLİK HEADER'LARI
    # ══════════════════════════════════════════════
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── Proje Kök Dizini ──
    root /var/www/caku-erasmus/dist;
    index index.html;

    # ══════════════════════════════════════════════
    # RATE LIMITING
    # ══════════════════════════════════════════════
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_conn conn_limit 15;
        try_files $uri $uri/ /index.html;
    }

    # ══════════════════════════════════════════════
    # NODE.JS BACKEND VE SOCKET.IO YÖNLENDİRMELERİ
    # ══════════════════════════════════════════════
    
    # Socket.io (Gerçek zamanlı iletişim)
    location /socket.io/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout sürelerini websocket için uzatıyoruz
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API İstekleri
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Statik Dosyalar ──
    location ~* \.(jsx|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        limit_req zone=general burst=50 nodelay;
        try_files $uri =404;
    }

    # ══════════════════════════════════════════════
    # WAF (Web Application Firewall) KURALLARI
    # ══════════════════════════════════════════════

    # SQL Injection koruması
    set $block_sql_injections 0;
    if ($query_string ~ "union.*select.*\(") { set $block_sql_injections 1; }
    if ($query_string ~ "concat.*\(") { set $block_sql_injections 1; }
    if ($query_string ~ "union.*all.*select") { set $block_sql_injections 1; }
    if ($query_string ~* "(\'|\")(.*)(drop|insert|md5|select|union|update|delete|truncate|alter|create|grant)") { set $block_sql_injections 1; }
    if ($block_sql_injections = 1) { return 403; }

    # XSS koruması
    set $block_xss 0;
    if ($query_string ~* "(<|%3C).*script.*(>|%3E)") { set $block_xss 1; }
    if ($query_string ~* "javascript:") { set $block_xss 1; }
    if ($query_string ~* "vbscript:") { set $block_xss 1; }
    if ($query_string ~* "on(click|load|error|mouseover|submit|focus|blur)\s*=") { set $block_xss 1; }
    if ($block_xss = 1) { return 403; }

    # Path Traversal koruması
    if ($query_string ~* "\.\.\/") { return 403; }
    if ($query_string ~* "(\.\.%2F|%2E%2E/)") { return 403; }
    if ($uri ~* "\.\.") { return 403; }

    # Kötü bot engelleme
    if ($http_user_agent ~* (havij|sqlmap|nikto|nmap|masscan|dirbuster|gobuster|wpscan|nessus|acunetix|w3af|burpsuite)) {
        return 403;
    }

    # Boş User-Agent engelleme
    if ($http_user_agent = "") { return 444; }

    # Tehlikeli HTTP metotlarını engelle
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    client_max_body_size 10m;

    # ══════════════════════════════════════════════
    # VERİTABANI VE GİT DİZİNİ GİZLEME
    # ══════════════════════════════════════════════

    # .git dizini engelleme
    location ~ /\.git {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Tüm gizli dosyalar
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Veritabanı dosyaları
    location ~* \.(sql|sqlite|sqlite3|db|mdb|accdb|bak|old|dump)$ {
        deny all;
        return 404;
    }

    # Yapılandırma ve hassas dosyalar
    location ~* (\.env|\.config|\.yml|\.yaml|\.toml|\.ini|\.conf|\.cfg|\.log|\.bak|\.swp|\.swo|\.tmp)$ {
        deny all;
        return 404;
    }

    # Kaynak kodu dosyaları (JSX hariç)
    location ~* \.(py|rb|php|java|go|rs|sh|bash|ps1|bat|cmd)$ {
        deny all;
        return 404;
    }

    # Konfigürasyon dosyaları
    location ~* (package\.json|package-lock\.json|firebase\.json|firestore\.rules|\.firebaserc|requirements\.txt|cors\.json) {
        deny all;
        return 404;
    }

    # Yaygın saldırı hedefleri
    location ~* (wp-admin|wp-login|wp-content|phpmyadmin|adminer|\.php) {
        deny all;
        return 404;
    }

    # ── Gzip Sıkıştırma ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml text/jsx;
    gzip_min_length 256;
    gzip_vary on;

    # ── Log Dosyaları ──
    access_log /var/log/nginx/caku-erasmus-access.log;
    error_log  /var/log/nginx/caku-erasmus-error.log;
}
