# ══════════════════════════════════════════════════════════════
# Patent & FSMH Takibi — nginx parçası (/etc/nginx/snippets/patent-takip.conf)
#
# Ayrı uygulama (mrtunahan/patent: FastAPI + kendi SQLite veritabanı),
# 127.0.0.1:8001'de çalışır (.env: ROOT_PATH=/patent, VITE_BASE_PATH=/patent/).
# Uygulamanın kendi girişi YOKTUR: /patent/ altındaki HER istek (sayfa, varlık,
# API) önce Offline Asistan'a sorulur — yalnız üniversite yetkilisinin atadığı
# Patent & FSMH yöneticisi geçer (server/routes/patent.js). Oturum çerezi
# (caku_auth) aynı alan adında olduğu için kendiliğinden taşınır.
#
# Kurulum ve güncelleme: scripts/patent-kur.sh (parçayı buraya koyar ve
# site ayarının HTTPS server bloğuna `include snippets/patent-takip.conf;`
# satırını ekler). Bu blok yoksa /patent/ genel kurala düşer ve Offline
# Asistan'ın kendi sayfası döner — modül "sisteme geri atıyor" gibi görünür.
# ══════════════════════════════════════════════════════════════
location = /_patent_yetki {
    internal;
    proxy_pass http://127.0.0.1:3001/api/patent/yetki;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# ^~ : regex location'lar (statik dosya kuralı) bu yolu yakalamasın.
location ^~ /patent/ {
    auth_request /_patent_yetki;
    client_max_body_size 12m;
    # Sondaki "/" öneki siler: uygulama /patent'i ROOT_PATH ile geri ekler.
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10;
    proxy_read_timeout 60;
    proxy_send_timeout 60;
}
