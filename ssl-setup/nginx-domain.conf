# ============================================================
# ÇAKÜ Erasmus - Nginx Konfigürasyonu (offlineasistan.com.tr)
# ============================================================
# Güvenlik Özellikleri:
#   - Rate Limiting (DDoS/brute-force koruması)
#   - WAF (Web Application Firewall) kuralları
#   - .git, veritabanı dosyaları gizleme
#   - Server bilgileri gizleme (UID, versiyon)
#   - Güvenlik header'ları
#
# Kurulum:
#   sudo cp nginx-domain.conf /etc/nginx/sites-available/caku-erasmus
#   sudo ln -sf /etc/nginx/sites-available/caku-erasmus /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl restart nginx
#
# SSL sertifikası (Let's Encrypt):
#   sudo certbot --nginx -d offlineasistan.com.tr -d www.offlineasistan.com.tr
# ============================================================

# ── Rate Limiting Tanımları ──
# Genel istekler: saniyede 10 istek (burst 20)
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Login/auth istekleri: saniyede 3 istek (brute-force koruması)
limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;

# API istekleri: saniyede 5 istek
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

# Bağlantı limiti: IP başına maksimum 15 eşzamanlı bağlantı
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Rate limit aşıldığında 429 döndür
limit_req_status 429;
limit_conn_status 429;

# HTTP -> HTTPS yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name offlineasistan.com.tr www.offlineasistan.com.tr;

    # Server bilgilerini gizle
    server_tokens off;

    # Let's Encrypt doğrulama
    location /.well-known/acme-challenge/ {
        root /var/www/caku-erasmus;
    }

    # Geri kalan tüm HTTP trafiğini HTTPS'e yönlendir
    location / {
        return 301 https://offlineasistan.com.tr$request_uri;
    }
}

# www -> non-www yönlendirme (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.offlineasistan.com.tr;

    # Server bilgilerini gizle
    server_tokens off;

    # SSL sertifikaları (Let's Encrypt tarafından otomatik ayarlanır)
    ssl_certificate     /etc/letsencrypt/live/offlineasistan.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/offlineasistan.com.tr/privkey.pem;

    return 301 https://offlineasistan.com.tr$request_uri;
}

# Ana HTTPS sunucu bloğu
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name offlineasistan.com.tr;

    # ══════════════════════════════════════════════
    # UID / SERVER BİLGİLERİ GİZLEME
    # ══════════════════════════════════════════════
    server_tokens off;
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';
    more_clear_headers 'X-AspNet-Version';
    more_clear_headers 'X-Runtime';
    more_clear_headers 'X-Version';
    more_clear_headers 'X-Request-Id';

    # ── SSL Sertifika Yolları (Let's Encrypt) ──
    ssl_certificate     /etc/letsencrypt/live/offlineasistan.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/offlineasistan.com.tr/privkey.pem;

    # ── SSL Güvenlik Ayarları ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ══════════════════════════════════════════════
    # GÜVENLİK HEADER'LARI
    # ══════════════════════════════════════════════
    # HSTS - tarayıcılara her zaman HTTPS kullanmasını söyle
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.quilljs.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.quilljs.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://firestore.googleapis.com; frame-src 'none';" always;

    # ── Proje Kök Dizini ──
    root /var/www/caku-erasmus;
    index index.html;

    # ══════════════════════════════════════════════
    # RATE LIMITING
    # ══════════════════════════════════════════════
    # Ana sayfa ve genel istekler
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_conn conn_limit 15;
        try_files $uri $uri/ /index.html;
    }

    # ── Statik Dosyalar (JSX, CSS, JS, Resimler) ──
    location ~* \.(jsx|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Statik dosyalarda rate limit daha yüksek
        limit_req zone=general burst=50 nodelay;
        try_files $uri =404;
    }

    # ══════════════════════════════════════════════
    # WAF (Web Application Firewall) KURALLARI
    # ══════════════════════════════════════════════

    # SQL Injection koruması
    set $block_sql_injections 0;
    if ($query_string ~ "union.*select.*\(") { set $block_sql_injections 1; }
    if ($query_string ~ "concat.*\(") { set $block_sql_injections 1; }
    if ($query_string ~ "union.*all.*select") { set $block_sql_injections 1; }
    if ($query_string ~* "(\'|\")(.*)(drop|insert|md5|select|union|update|delete|truncate|alter|create|grant)") { set $block_sql_injections 1; }
    if ($block_sql_injections = 1) { return 403; }

    # XSS koruması
    set $block_xss 0;
    if ($query_string ~* "(<|%3C).*script.*(>|%3E)") { set $block_xss 1; }
    if ($query_string ~* "javascript:") { set $block_xss 1; }
    if ($query_string ~* "vbscript:") { set $block_xss 1; }
    if ($query_string ~* "on(click|load|error|mouseover|submit|focus|blur)\s*=") { set $block_xss 1; }
    if ($block_xss = 1) { return 403; }

    # Path Traversal koruması
    if ($query_string ~* "\.\.\/") { return 403; }
    if ($query_string ~* "(\.\.%2F|%2E%2E/)") { return 403; }
    if ($uri ~* "\.\.") { return 403; }

    # User-Agent filtresi (bilinen kötü botlar)
    if ($http_user_agent ~* (havij|sqlmap|nikto|nmap|masscan|dirbuster|gobuster|wpscan|nessus|acunetix|w3af|burpsuite)) {
        return 403;
    }

    # Boş User-Agent engelleme
    if ($http_user_agent = "") { return 444; }

    # Tehlikeli HTTP metotlarını engelle
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    # Çok büyük istek gövdelerini engelle (dosya upload hariç)
    client_max_body_size 10m;

    # ══════════════════════════════════════════════
    # EK GÜVENLİK ÖNLEMLERİ
    # ══════════════════════════════════════════════

    # Shellshock koruması
    if ($http_user_agent ~* "(\(|\)|;|\||`|{|})" ) {
        return 403;
    }

    # HTTP Host header injection koruması
    if ($host !~ ^(offlineasistan\.com\.tr|www\.offlineasistan\.com\.tr)$ ) {
        return 444;
    }

    # Request URI uzunluk sınırı (buffer overflow koruması)
    large_client_header_buffers 4 8k;

    # Timeout ayarları (Slowloris DDoS koruması)
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;
    keepalive_timeout 15;
    keepalive_requests 100;

    # ══════════════════════════════════════════════
    # VERİTABANI VE GİT DİZİNİ GİZLEME
    # ══════════════════════════════════════════════

    # .git dizini engelleme
    location ~ /\.git {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Tüm gizli dosyalar (., .env, .htaccess, vb.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Veritabanı dosyalarını engelle
    location ~* \.(sql|sqlite|sqlite3|db|mdb|accdb|bak|old|dump)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Yapılandırma ve hassas dosyaları engelle
    location ~* (\.env|\.config|\.yml|\.yaml|\.toml|\.ini|\.conf|\.cfg|\.log|\.bak|\.swp|\.swo|\.tmp)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Kaynak kodu dosyalarını engelle (JSX hariç - uygulama için gerekli)
    location ~* \.(py|rb|php|java|go|rs|sh|bash|ps1|bat|cmd)$ {
        deny all;
        return 404;
    }

    # Yedek dosyaları engelle
    location ~* ~$ {
        deny all;
        return 404;
    }

    # package.json, firebase.json gibi konfigürasyon dosyaları
    location ~* (package\.json|package-lock\.json|firebase\.json|firestore\.rules|\.firebaserc|requirements\.txt|cors\.json) {
        deny all;
        return 404;
    }

    # wp-admin, phpmyadmin gibi yaygın saldırı hedeflerini engelle
    location ~* (wp-admin|wp-login|wp-content|phpmyadmin|adminer|\.php) {
        deny all;
        return 404;
    }

    # ── Gzip Sıkıştırma ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml text/jsx;
    gzip_min_length 256;
    gzip_vary on;

    # ── Log Dosyaları ──
    access_log /var/log/nginx/caku-erasmus-access.log;
    error_log  /var/log/nginx/caku-erasmus-error.log;
}
