name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ⚠ LINT CI'DA KOŞMUYORDU ve bu yüzden `npm run lint` uzun süre KIRIK
      # kaldı (ecosystem.config.js'te 'module is not defined' hatası kimsenin
      # görmediği bir yerde duruyordu). Uyarılar engel değil; yalnız HATA
      # derlemeyi durdurur.
      - name: Lint (eslint)
        run: npm run lint

      - name: Build (Vite)
        run: npm run build

      - name: Unit tests (vitest)
        run: npm test -- --run

      # Bağımlılık açıkları sessizce girmesin. Yalnız YÜKSEK ve üstü kırar;
      # moderate/low uyarı olarak kalır (aksi halde CI sürekli kırmızı olur).
      - name: Bağımlılık denetimi (npm audit)
        run: npm audit --omit=dev --audit-level=high

  server:
    name: Server install & syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check (node --check)
        run: |
          set -e
          for f in $(find . -name '*.js' -not -path './node_modules/*'); do
            node --check "$f"
          done

      - name: Bağımlılık denetimi (npm audit)
        run: npm audit --omit=dev --audit-level=high || true
