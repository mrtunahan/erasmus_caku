name: Dependency review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Yüksek ve üstü zafiyetlerde PR'ı kırar
          fail-on-severity: high
          # Lisans bildirimi (uyarı amaçlı; bloklamaz)
          allow-licenses: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0, Unlicense, 0BSD
          comment-summary-in-pr: on-failure
