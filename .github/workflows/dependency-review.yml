name: Dependency review

# Bu workflow yalnızca repo'da Dependency Graph etkinse anlamlı çalışır.
# (Settings → Code security and analysis → Dependency graph)
# Henüz etkin değilse continue-on-error sayesinde PR'ı bloklamaz.

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    # Dependency Graph yoksa veya GHAS etkin değilse PR'ı kırmasın
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Yalnızca kritik zafiyetlerde uyar; lisans kontrolü bilgi amaçlı
          fail-on-severity: critical
          comment-summary-in-pr: on-failure
