# ============================================================
# Bu workflow devre dışı bırakılmıştır.
# Duyurular artık sunucuda cron job ile çekilmektedir.
#
# Sunucuda kurulum:
#   crontab -e
#   0 */6 * * * /var/www/erasmus_caku/duyuru-guncelle.sh >> /var/log/duyuru-scraper.log 2>&1
#
# Manuel tetikleme:
#   ./duyuru-guncelle.sh
#   ./duyuru-guncelle.sh bmu univ
#   ./duyuru-guncelle.sh --debug
# ============================================================

name: Duyuru Scraper (Devre Dışı)

on:
  workflow_dispatch:
    inputs:
      kaynaklar:
        description: 'Kaynaklar (boş = hepsi, örn: bmu univ)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: |
          if [ -n "${{ github.event.inputs.kaynaklar }}" ]; then
            python3 scraper.py --output duyurular/duyurular.json --verbose --kaynaklar ${{ github.event.inputs.kaynaklar }}
          else
            python3 scraper.py --output duyurular/duyurular.json --verbose
          fi

      - name: Show scraper results summary
        if: always()
        run: |
          echo "=== Scraper Sonuç Özeti ==="
          if [ -f duyurular/duyurular.json ]; then
            python3 -c "
          import json
          with open('duyurular/duyurular.json') as f:
              d = json.load(f)
          m = d.get('meta', {})
          print(f'Toplam: {m.get(\"toplam_duyuru\", 0)} duyuru')
          print(f'Sürüm: {m.get(\"scraper_surumu\", \"?\")}')
          for k, v in m.get('kaynaklar', {}).items():
              durum = m.get('kaynak_durumlari', {}).get(k, '?')
              print(f'  {k}: {v} duyuru ({durum})')
          "
          else
            echo "duyurular.json bulunamadı!"
          fi

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet duyurular/duyurular.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add duyurular/duyurular.json
          git commit -m "chore: duyurular.json otomatik guncelleme [skip ci]"
          git push
