name: Duyuru Scraper

on:
  # Her 6 saatte bir otomatik çalıştır
  schedule:
    - cron: '0 */6 * * *'
  # Manuel tetikleme
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: python3 scraper.py --output duyurular/duyurular.json --verbose

      - name: Show scraper results summary
        if: always()
        run: |
          echo "=== Scraper Sonuç Özeti ==="
          if [ -f duyurular/duyurular.json ]; then
            python3 -c "
import json
with open('duyurular/duyurular.json') as f:
    d = json.load(f)
m = d.get('meta', {})
print(f'Toplam: {m.get(\"toplam_duyuru\", 0)} duyuru')
print(f'Sürüm: {m.get(\"scraper_surumu\", \"?\")}')
for k, v in m.get('kaynaklar', {}).items():
    durum = m.get('kaynak_durumlari', {}).get(k, '?')
    print(f'  {k}: {v} duyuru ({durum})')
"
          else
            echo "duyurular.json bulunamadı!"
          fi

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet duyurular/duyurular.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add duyurular/duyurular.json
          git commit -m "chore: duyurular.json otomatik guncelleme [skip ci]"
          git push
